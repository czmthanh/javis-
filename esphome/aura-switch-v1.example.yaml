esphome:
  name: aura-switch-v1
  friendly_name: AURA Switch V1

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AURA Switch V1 Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

switch:
  - platform: gpio
    pin: GPIO5
    name: "AURA Switch CH1"
    id: relay_ch1
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO6
    name: "AURA Switch CH2"
    id: relay_ch2
    restore_mode: RESTORE_DEFAULT_OFF
